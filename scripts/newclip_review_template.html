<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>__TITLE__</title>
<style>
  :root {
    --bg: #14171c; --panel: #1b1f26; --panel2: #232831; --line: #2e3540;
    --text: #e8ebf0; --dim: #a1abb9; --dim2: #727d8c;
    --ok: #2e9e63; --bad: #c4462b; --accent: #4aa3ff;
    --car: #3cd23c; --ped: #f05050;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.6 "Microsoft JhengHei", "Segoe UI", system-ui, sans-serif; }
  button { font: inherit; color: var(--text); cursor: pointer; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: .92em; }
  .hidden { display: none !important; }

  /* ---- the task, always on top */
  .task { background: #1d2733; border-bottom: 1px solid #33465c; padding: 14px 28px; }
  .task-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 24px; align-items: center; }
  .task p { margin: 0; font-size: 18px; flex: 1; }
  .task b.ok { color: #7fe0a8; } .task b.bad { color: #ff9b85; }
  .progress { text-align: right; white-space: nowrap; }
  .progress .count { font-size: 22px; font-weight: 700; }
  .progress .left { color: var(--dim); font-size: 14px; }
  .bar { height: 5px; background: #0f1216; }
  .bar span { display: block; height: 100%; background: var(--accent); transition: width .2s; }

  main { max-width: 1100px; margin: 0 auto; padding: 18px 28px 40px; }

  /* ---- one event */
  .where { display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; margin-bottom: 10px; }
  .where .time { font-size: 20px; font-weight: 700; }
  .where .video { color: var(--dim); font-size: 14px; }
  .where .done { margin-left: auto; font-size: 14px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); }
  .done.v-A { color: #ffb4a3; border-color: #7a3424; } .done.v-C { color: #9be6bb; border-color: #2b6347; }
  .done.v-B, .done.v-D { color: #c8d0dc; }
  .look { margin: 0 0 10px; color: var(--dim); font-size: 15px; }
  .look .car { color: var(--car); font-weight: 700; } .look .ped { color: var(--ped); font-weight: 700; }
  .clip { display: block; width: 100%; border-radius: 10px; border: 1px solid var(--line); background: #000; }
  .clip-note { color: var(--dim2); font-size: 13px; margin: 6px 0 0; }
  .hint { margin: 12px 0 0; padding: 9px 14px; border-radius: 8px; background: #2a2414; border: 1px solid #5f4c1e;
    color: #ecd08e; font-size: 14.5px; }

  /* ---- the decision */
  .decide { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 18px 0 8px; }
  .big { border: 2px solid; border-radius: 12px; padding: 16px 18px; text-align: left; background: var(--panel); }
  .big .t { display: block; font-size: 22px; font-weight: 700; }
  .big .s { display: block; font-size: 14px; color: var(--dim); margin-top: 2px; }
  .big kbd { float: right; }
  .big.ok { border-color: #2b6347; } .big.ok:hover, .big.ok.on { background: #173a29; border-color: var(--ok); }
  .big.bad { border-color: #7a3424; } .big.bad:hover, .big.bad.on { background: #3d1c14; border-color: var(--bad); }
  kbd { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--dim); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 5px; padding: 0 7px; background: var(--panel2); }

  .minor { display: flex; gap: 10px 18px; align-items: center; flex-wrap: wrap; color: var(--dim2); font-size: 13.5px; }
  .small { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 3px 10px; color: var(--dim);
    font-size: 13.5px; }
  .small:hover, .small.on { color: var(--text); border-color: #56606e; background: var(--panel2); }
  .small kbd { font-size: 11.5px; padding: 0 5px; margin-left: 4px; }
  .minor input { flex: 1; min-width: 180px; font: inherit; font-size: 13.5px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 7px; padding: 4px 10px; }
  .minor input:focus { outline: none; border-color: var(--accent); }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 12px;
    border-top: 1px solid var(--line); color: var(--dim2); font-size: 13.5px; }
  .nav button { background: none; border: 1px solid var(--line); border-radius: 7px; padding: 5px 12px; color: var(--dim); }
  .nav button:hover { color: var(--text); }

  /* ---- layer 2 */
  details.tech { margin-top: 20px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  details.tech > summary { cursor: pointer; padding: 11px 16px; color: var(--dim); font-size: 15px; }
  details.tech > summary:hover { color: var(--text); }
  .tech-body { padding: 0 16px 16px; }
  .tech-body h3 { font-size: 14px; color: var(--dim); margin: 14px 0 6px; font-weight: 600; }
  .tech-body ol { margin: 0; padding-left: 20px; font-size: 14px; }
  .tech-body li { margin-bottom: 5px; }
  table.facts { border-collapse: collapse; width: 100%; font-size: 13px; }
  table.facts td { padding: 3px 6px; border-bottom: 1px solid #262c35; vertical-align: top; }
  table.facts td:first-child { color: var(--dim); white-space: nowrap; width: 1%; }
  .strip { overflow-x: auto; border-radius: 8px; border: 1px solid var(--line); background: #000; }
  .strip img { height: 240px; display: block; }
  .tl { position: relative; height: 26px; background: var(--panel2); border-radius: 5px; overflow: hidden; display: flex; }
  .tl i { flex: 1 1 0; height: 100%; }
  .tl i.c0 { background: #2b313a; } .tl i.c1 { background: #7a5f1c; } .tl i.c2 { background: #1f7a4d; } .tl i.c3 { background: #101318; }
  .tl i.q { outline: 1px solid rgba(255,255,255,.2); outline-offset: -1px; }
  .tl .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: #ffd479; }
  .tl-key { font-size: 12px; color: var(--dim2); margin-top: 4px; }
  .prior { font-size: 13.5px; color: #e3c27a; margin: 4px 0; }

  /* ---- export page */
  .finish { text-align: center; padding: 50px 0 20px; }
  .finish h2 { font-size: 26px; margin: 0 0 6px; }
  .finish .sum { color: var(--dim); margin: 0 0 26px; font-size: 16px; }
  .finish .sum b { color: var(--text); }
  .export-btn { font-size: 20px; font-weight: 700; padding: 14px 34px; border-radius: 12px; border: 2px solid var(--accent);
    background: #1d2c3f; }
  .export-btn:hover { background: #24384f; }
  .finish .after { color: var(--dim2); font-size: 13.5px; margin: 18px auto 0; max-width: 640px; }
  .open-list { margin: 22px auto 0; max-width: 640px; text-align: left; background: #2a2414; border: 1px solid #5f4c1e;
    border-radius: 10px; padding: 12px 16px; color: #ecd08e; font-size: 14.5px; }
  .open-list button { background: none; border: 1px solid #6a5523; color: #ecd08e; border-radius: 6px; padding: 1px 8px;
    margin: 3px 4px 0 0; font-size: 13.5px; }
  .tally { display: inline-grid; grid-template-columns: auto auto; gap: 2px 18px; text-align: left; margin: 0 0 24px;
    font-size: 15px; }
  .tally span:nth-child(even) { font-weight: 700; text-align: right; }
  footer { color: var(--dim2); font-size: 12px; text-align: center; padding: 10px 28px 30px; }
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); background: #263140; border: 1px solid #3d4a5c;
    padding: 8px 16px; border-radius: 9px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="task">
  <div class="task-inner">
    <p>你要判斷：<b>綠框這台車</b>經過斑馬線的時候，有沒有讓<b>紅框這位行人</b>。<br>
      有讓（或根本沒擋到行人）→ <b class="ok">沒有違規</b>；沒讓 → <b class="bad">有違規</b>。</p>
    <div class="progress"><div class="count" id="count"></div><div class="left" id="left"></div></div>
  </div>
</div>
<div class="bar"><span id="bar"></span></div>

<main>
  <section id="event"></section>
  <section id="finish" class="finish hidden"></section>
</main>
<footer>__SUBTEXT__<br>__FOOTER__</footer>
<div class="toast" id="toast"></div>

<script>
const DATA = __PAYLOAD__;
const KEY = "__STORAGE_KEY__";
// The export keeps the scorer's letters and legend; the page only shows the plain names.
const LABEL = { A: "合理", B: "重報", C: "不合理", D: "不確定" };
const SHOWN = { A: "有違規", C: "沒有違規", B: "重複報告", D: "看不出來" };
const KEYS = { "1": "C", "2": "A", "3": "B", "4": "D" };
const TOTAL = DATA.events.length;

let store = {};
try { store = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { store = {}; }
const save = () => localStorage.setItem(KEY, JSON.stringify(store));
const verdictOf = (ev) => store[ev.id] && store[ev.id].v;
const decided = () => DATA.events.filter(verdictOf).length;
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// index TOTAL is the export page
let index = DATA.events.findIndex((e) => !verdictOf(e));
if (index < 0) index = TOTAL;

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1600);
}

function paintProgress() {
  const n = decided();
  document.getElementById("count").textContent = index < TOTAL ? `第 ${index + 1} / ${TOTAL} 件` : `${TOTAL} 件 · 匯出`;
  document.getElementById("left").textContent = n === TOTAL ? "全部判完了" : `還有 ${TOTAL - n} 件沒判`;
  document.getElementById("bar").style.width = `${(n / TOTAL) * 100}%`;
}

function hints(ev) {
  const out = [];
  const n = ev.neighbour;
  if (n) out.push(`同一支影片在 ${n.time_s.toFixed(1)} 秒（差 ${n.delta_s.toFixed(1)} 秒）已經判過一件。`
    + `如果這兩件其實是同一台車、同一次經過，按「重複報告」。`);
  (ev.priors || []).forEach((p) => out.push(`以前在 ${p.time_s.toFixed(1)} 秒判過一筆「${SHOWN[p.verdict] || p.verdict}」，`
    + `時間對不太上，請重新看一次再判。`));
  return out.map((t) => `<p class="hint">${esc(t)}</p>`).join("");
}

function techHtml(ev) {
  const first = ev.window[0], span = Math.max(1, ev.window[1] - first);
  const cells = ev.timeline.map((r) => `<i class="c${r.c}${r.q ? " q" : ""}"></i>`).join("");
  const mark = `<span class="mark" style="left:${(((ev.frame - first) / span) * 100).toFixed(2)}%"></span>`;
  const priors = (ev.priors || []).map((p) => `<p class="prior">舊判定：${p.time_s.toFixed(3)}s、車 ${p.vehicle} → `
    + `${p.verdict}（${LABEL[p.verdict] || ""}），差 ${p.delta_s.toFixed(2)}s，超過 1.25s 容差接不上。`
    + `${p.note ? "舊備註：" + esc(p.note) : ""}</p>`).join("");
  const review = (ev.review_reasons || []).length ? `<p class="prior">規則自己標了待複核：${esc(ev.review_reasons.join("、"))}</p>` : "";
  return `
    <details class="tech" id="tech">
      <summary>系統為什麼認為這是一件「未讓行人」（技術細節，判斷時不一定要看）<kbd style="margin-left:8px">T</kbd></summary>
      <div class="tech-body">
        ${priors}${review}
        <h3>理由</h3>
        <ol>${ev.reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ol>
        <h3>數值（括號裡是規則門檻）</h3>
        <table class="facts">${ev.facts.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
        <h3>行人狀態時間軸（${ev.timeline[0].t.toFixed(2)}s → ${ev.timeline[ev.timeline.length - 1].t.toFixed(2)}s）</h3>
        <div class="tl">${cells}${mark}</div>
        <div class="tl-key">灰＝不在斑馬線旁、黃褐＝在路緣、綠＝在斑馬線上、黑＝沒偵測到；白框格＝規則條件成立；黃線＝系統標記的時刻</div>
        <h3>逐格（同一段，7 張，左右捲動）</h3>
        <div class="strip"><img src="${ev.media.strip}" alt="逐格"></div>
        <p class="clip-note">車 id ${ev.vehicle_id}（${esc(ev.vehicle_kind)}）· 行人 id ${ev.pedestrian_id} · 幀 ${ev.frame} · 編號 ${ev.id}</p>
      </div>
    </details>`;
}

function eventHtml(ev) {
  const v = verdictOf(ev);
  const rec = store[ev.id] || {};
  const small = (code, text, why) => `<button class="small${v === code ? " on" : ""}" data-v="${code}" title="${why}">`
    + `${text}<kbd>${Object.keys(KEYS).find((k) => KEYS[k] === code)}</kbd></button>`;
  return `
    <div class="where">
      <span class="time">影片的 ${ev.time_s.toFixed(1)} 秒</span>
      <span class="video">${esc(ev.video)}</span>
      ${v ? `<span class="done v-${v}">你判了：${SHOWN[v]}</span>` : ""}
    </div>
    <p class="look">看 <span class="car">綠框「這台車」</span> 和 <span class="ped">紅框「這位行人」</span>。
      下面是系統標記時刻前後各約 1.5 秒，會自動重播。</p>
    <img class="clip" src="${ev.media.clip}" alt="事件前後的連續畫面">
    <p class="clip-note">畫面左上角寫著現在是第幾秒、離系統標記的時刻還有多久。黃色斑馬線輪廓是系統認定的斑馬線範圍。</p>
    ${hints(ev)}
    <div class="decide">
      <button class="big ok${v === "C" ? " on" : ""}" data-v="C"><kbd>1</kbd>
        <span class="t">沒有違規</span><span class="s">車有讓行人，或車根本沒擋到行人</span></button>
      <button class="big bad${v === "A" ? " on" : ""}" data-v="A"><kbd>2</kbd>
        <span class="t">有違規</span><span class="s">行人在走斑馬線，車沒停下來讓他</span></button>
    </div>
    <div class="minor">
      <span>都不是的話：</span>
      ${small("B", "重複報告", "同一台車、同一次經過，已經在別件報過了")}
      ${small("D", "看不出來", "畫面太糊、被擋住，或資訊不夠判斷")}
      <input id="note" placeholder="備註（可不填）" value="${esc(rec.note || "")}">
    </div>
    ${techHtml(ev)}
    <div class="nav">
      <button id="prev" ${index === 0 ? "disabled" : ""}>← 上一件</button>
      <span>判完會自動跳到下一件 · <kbd>←</kbd> <kbd>→</kbd> 切換</span>
      <button id="next">${index === TOTAL - 1 ? "到匯出頁 →" : "下一件 →"}</button>
    </div>`;
}

function finishHtml() {
  const counts = { A: 0, B: 0, C: 0, D: 0 };
  DATA.events.forEach((e) => { const v = verdictOf(e); if (v) counts[v]++; });
  const open = DATA.events.map((e, i) => [e, i]).filter(([e]) => !verdictOf(e));
  const n = decided();
  return `
    <h2>${n === TOTAL ? `${TOTAL} 件都判完了` : `還有 ${TOTAL - n} 件沒判`}</h2>
    <p class="sum">已判 <b>${n}</b> / ${TOTAL} 件。判定已自動存在這個瀏覽器裡；按下面的按鈕存成檔案交出去。</p>
    <div class="tally">
      <span>沒有違規</span><span>${counts.C}</span><span>有違規</span><span>${counts.A}</span>
      <span>重複報告</span><span>${counts.B}</span><span>看不出來</span><span>${counts.D}</span>
    </div><br>
    <button class="export-btn" id="export-json">匯出 JSON</button>
    ${open.length ? `<div class="open-list">沒判的會以空白匯出。要先補判，點編號回去：<br>
      ${open.map(([e, i]) => `<button data-go="${i}">第 ${i + 1} 件（${e.time_s.toFixed(1)} 秒）</button>`).join("")}</div>` : ""}
    <p class="after">下載的檔名是 <code>__EXPORT_PREFIX__-verdicts-&lt;時間&gt;.json</code>，格式跟舊頁面一樣，
      算分程式 <code>scripts/newclip_score.py --verdicts</code> 直接吃。<br>
      <button class="small" id="back">← 回到第 ${TOTAL} 件</button>
      <button class="small" id="reset">清除全部判定</button></p>`;
}

function render() {
  const eventEl = document.getElementById("event");
  const finishEl = document.getElementById("finish");
  if (index < TOTAL) {
    const tech = document.getElementById("tech");
    const keepOpen = tech && tech.open;
    eventEl.innerHTML = eventHtml(DATA.events[index]);
    if (keepOpen) document.getElementById("tech").open = true;
    eventEl.classList.remove("hidden"); finishEl.classList.add("hidden");
  } else {
    finishEl.innerHTML = finishHtml();
    finishEl.classList.remove("hidden"); eventEl.classList.add("hidden");
  }
  paintProgress();
  window.scrollTo(0, 0);
}

function go(i) { index = Math.max(0, Math.min(TOTAL, i)); render(); }

function nextAfterVerdict() {
  for (let i = index + 1; i < TOTAL; i++) if (!verdictOf(DATA.events[i])) return i;
  for (let i = 0; i < index; i++) if (!verdictOf(DATA.events[i])) return i;
  return TOTAL;
}

function judge(code) {
  const ev = DATA.events[index];
  const rec = store[ev.id] || (store[ev.id] = {});
  rec.v = code; rec.at = new Date().toISOString(); rec.note = rec.note || "";
  save();
  toast(`第 ${index + 1} 件：${SHOWN[code]}`);
  setTimeout(() => go(nextAfterVerdict()), 150);
}

function exportJson() {
  const verdicts = DATA.events.map((e) => {
    const rec = store[e.id] || {};
    return { id: e.id, video: e.video, time_s: e.time_s, frame: e.frame,
      vehicle_id: e.vehicle_id, vehicle_kind: e.vehicle_kind,
      pedestrian_id: e.pedestrian_id, pedestrian_state: e.pedestrian_state,
      contact_s: e.contact_s, verdict: rec.v || null, note: rec.note || "",
      origin: e.origin || null, decided_at: rec.at || null };
  });
  const payload = { schema: DATA.schema, generated_at: DATA.generated_at, source: DATA.source, params: DATA.params,
    legend: LABEL, counts: { total: TOTAL, decided: decided() }, verdicts };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `__EXPORT_PREFIX__-verdicts-${new Date().toISOString().slice(0, 16).replace(/[-:T]/g, "")}.json`;
  a.click();
  toast(`已匯出 ${decided()} / ${TOTAL} 件`);
}

document.addEventListener("click", (event) => {
  const t = event.target;
  const vb = t.closest("button[data-v]");
  if (vb) return judge(vb.dataset.v);
  const gb = t.closest("button[data-go]");
  if (gb) return go(Number(gb.dataset.go));
  const id = t.closest("button") && t.closest("button").id;
  if (id === "prev") go(index - 1);
  else if (id === "next") go(index + 1);
  else if (id === "back") go(TOTAL - 1);
  else if (id === "export-json") exportJson();
  else if (id === "reset" && confirm(`清除 ${TOTAL} 件的判定與備註？（匯出過的檔案不受影響）`)) {
    store = {}; save(); go(0);
  }
});

document.addEventListener("input", (event) => {
  if (event.target.id !== "note" || index >= TOTAL) return;
  const ev = DATA.events[index];
  (store[ev.id] || (store[ev.id] = {})).note = event.target.value;
  save();
});

document.addEventListener("keydown", (event) => {
  if (event.target.matches("input, textarea")) {
    if (event.key === "Escape" || event.key === "Enter") event.target.blur();
    return;
  }
  if (event.ctrlKey || event.altKey || event.metaKey) return;
  if (KEYS[event.key] && index < TOTAL) { judge(KEYS[event.key]); event.preventDefault(); }
  else if (event.key === "ArrowRight") { go(index + 1); event.preventDefault(); }
  else if (event.key === "ArrowLeft") { go(index - 1); event.preventDefault(); }
  else if (event.key.toLowerCase() === "t" && index < TOTAL) {
    const tech = document.getElementById("tech"); tech.open = !tech.open;
  }
});

render();
</script>
</body>
</html>
